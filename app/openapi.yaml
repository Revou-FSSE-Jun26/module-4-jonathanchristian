          description: Comment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentEnvelope" }
              example:
                data:
                  comment_id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c44
                  card_id: c2d5e4a1-0b6f-4e3d-9d1c-7f8e9a0b1c33
                  content: Looks good to me
                  author: { user_id: 3f2b1c1e-7d54-4c1a-9a43-0b5e2f6f1d11, name: Ada Lovelace }
                  created_at: "2026-11-16T10:30:00.000000Z"
                  updated_at: "2026-11-16T10:30:00.000000Z"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Comments]
