        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/comments/{comment_id}:
    parameters:
      - name: comment_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Comments]
      summary: Edit a comment (author only; admins, other members, and guests get 403)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentRequest" }
            example: { content: Looks great }
      responses:
        "200":
          description: Updated comment (`updated_at` refreshed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentEnvelope" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Comments]
      summary: Soft delete a comment (author only; a guest gets 403 even for an old own comment)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      comment_id: { type: string, format: uuid }
              example: { data: { comment_id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c44 } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/boards/{board_id}/invite-links:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [Invitations]
      summary: Read the member and guest invitation tokens (admin or manager)
      description: Boards created before V6 have no tokens yet; they are created and stored on the first request. The invitation link for a token is `<web origin>/invite/<token>`. Members, guests, and non-participants get 403 and never see a token. Managers read the same tokens as the admin.
      responses:
        "200":
          description: Both tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteLinksEnvelope" }
              example:
                data:
                  member: { role: member, token: q3Zr8mT1vK9xWc2LpN6aYb4sD7eFh0JgUiOtRkEyXzA }
                  guest: { role: guest, token: B5nHc1VdSx8QwErTyUiOp3AsDfGhJkLzXcVbNm7Pq2Y }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/boards/{board_id}/invite-links/{role}/regenerate:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - name: role
        in: path
        required: true
        schema: { type: string, enum: [member, guest] }
    post:
      tags: [Invitations]
      summary: Replace the token of one role (admin or manager)
      description: No body. The old token stops working at once; the other role's token and all memberships are unchanged. The board is checked first (404, 403), then the role (400 for anything but `member` or `guest`). Returns 200, not 201.
      responses:
        "200":
          description: The new token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteLinkEnvelope" }
              example: { data: { role: guest, token: Zy9XwVu8TsRq7PoNm6LkJi5HgFe4DcBa3ZyXwVuTsRq } }
        "400":
          description: The role is neither `member` nor `guest`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/invites/{token}:
    parameters:
      - $ref: "#/components/parameters/InviteToken"
    get:
      tags: [Invitations]
      summary: What an invitation token grants
      description: Any authenticated user who knows the token may call it. Tokens do not expire and are not consumed. An unknown, replaced, malformed (not 43 to 128 characters of `A-Z a-z 0-9 _ -`), or soft-deleted-board token gives 404 with no board data.
      responses:
        "200":
          description: The board, the role the token grants, and the caller's current role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteInfoEnvelope" }
              example:
                data:
                  board_id: 9c1f6a52-2d0e-4f9c-8f64-6d5d3f7a0c01
                  board_name: Product roadmap
                  role: guest
                  current_role: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/invites/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/InviteToken"
    post:
      tags: [Invitations]
      summary: Join a board through an invitation token
      description: |
        No body. Always answers 200 (not 201) with the resulting role, and is safe to repeat or to send twice at the same time.
        With no active membership, one is created with the token's role. A `guest` who accepts the member token is upgraded to `member`. A `member`, `manager`, or `admin` never loses a role (a member accepting the guest token stays `member`; a manager stays `manager`; an admin stays `admin`). A soft-deleted membership of the same user is left untouched and a new active one is created. No notification is created and the token is not consumed.
      responses:
        "200":
          description: The caller's role on the board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptResultEnvelope" }
              example: { data: { board_id: 9c1f6a52-2d0e-4f9c-8f64-6d5d3f7a0c01, role: guest } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/notifications:
    get:
      tags: [Notifications]
      summary: My notifications (newest first, paginated)
      description: "`page` and `per_page` must be plain positive integers up to 2147483647; `per_page` is at most 100. A page past the last returns an empty `items` list with the same `total` and `unread_count`. `unread_count` covers all of the caller's unread notifications, not just this page."
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 2147483647, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: A page of notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPageEnvelope" }
              example:
                data:
                  items:
                    - notification_id: d4c3b2a1-f6e5-4b7a-9c8d-1e0f3a2b5c66
                      type: assignment
                      message: 'Assigned to you: "Write the spec"'
                      card_id: c2d5e4a1-0b6f-4e3d-9d1c-7f8e9a0b1c33
                      board_id: 9c1f6a52-2d0e-4f9c-8f64-6d5d3f7a0c01
                      is_read: false
                      created_at: "2026-11-16T10:26:00.000000Z"
                  page: 1
                  per_page: 20
                  total: 1
                  unread_count: 1
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cards/{card_id}/checklist:
    parameters:
      - $ref: "#/components/parameters/CardId"
    post:
      tags: [Checklist]
      summary: Add a checklist item (admin, manager, or member; a guest gets 403)
      description: Placed after the last active item (`order` 1.0 for the first) with `is_done` false. At most 50 active items per card; the 51st gives 400. A soft-deleted item does not count. The card is locked while adding, so two simultaneous adds cannot pass the cap. No notification is created and the card's `status` and `completed_at` do not change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistCreateRequest" }
            example: { text: Draft the outline }
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistItemEnvelope" }
              example:
                data: { checklist_item_id: 0b1c2d3e-4f50-4a61-8b72-93a4b5c6d7e8, text: Draft the outline, is_done: false, order: 1.0, created_at: "2026-11-16T10:26:00.000000Z", updated_at: "2026-11-16T10:26:00.000000Z" }
        "400":
          description: Validation error, or the card already has 50 items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example: { error: "checklist: limit of 50 items reached" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/checklist/{item_id}:
    parameters:
      - name: item_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Checklist]
      summary: Edit a checklist item (admin, manager, or member; a guest gets 403)
      description: Partial update; at least one of `text`, `is_done`, `order` is required. `is_done` must be the JSON boolean `true` or `false` (1, 0, and strings are 400). `order` is a finite number greater than 0.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistUpdateRequest" }
            example: { is_done: true }
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistItemEnvelope" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Checklist]
      summary: Soft delete a checklist item (admin, manager, or member; a guest gets 403)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      checklist_item_id: { type: string, format: uuid }
              example: { data: { checklist_item_id: 0b1c2d3e-4f50-4a61-8b72-93a4b5c6d7e8 } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/cards/{card_id}/links:
    parameters:
      - $ref: "#/components/parameters/CardId"
    post:
      tags: [Links]
      summary: Add a workspace link (admin, manager, or member; a guest gets 403)
      description: "`url` is trimmed and must have 1 to 2048 characters, no whitespace or control character, the scheme `http` or `https` (any letter case), and a host name; `javascript:`, `data:`, `file:`, scheme-less, and `//host` values give 400. `label` (1 to 100 characters after trimming) defaults to the lower-case host name, cut to 100 characters. `created_by` is the caller. At most 10 active links per card; the 11th gives 400. No notification is created and the stored URL is never requested by the server."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardLinkCreateRequest" }
            example: { url: "https://docs.example.com/spec", label: Spec }
      responses:
        "201":
          description: Link created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardLinkEnvelope" }
              example:
                data: { card_link_id: 2d3e4f50-6172-4c83-8d94-b5c6d7e8f90a, url: "https://docs.example.com/spec", label: Spec, created_by: 3f2b1c1e-7d54-4c1a-9a43-0b5e2f6f1d11, created_at: "2026-11-16T10:28:00.000000Z" }
        "400":
          description: Validation error (including an unsafe URL), or the card already has 10 links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example: { error: "links: limit of 10 links reached" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/links/{link_id}:
    parameters:
      - name: link_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Links]
      summary: Edit a link (admin, manager, or member; a guest gets 403)
      description: Partial update; at least one of `url` and `label` is required. A supplied `url` and `label` are validated again with the same rules as on create.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardLinkUpdateRequest" }
            example: { label: Final spec }
      responses:
        "200":
          description: Updated link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardLinkEnvelope" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Links]
      summary: Soft delete a link (admin, manager, or member; a guest gets 403)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      card_link_id: { type: string, format: uuid }
              example: { data: { card_link_id: 2d3e4f50-6172-4c83-8d94-b5c6d7e8f90a } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/notifications/overdue:
    get:
      tags: [Notifications]
      summary: My overdue cards (computed on read)
      description: |
        Cards whose `due_date` is before today (UTC; a card due today is not overdue), whose `status` is not `DONE` (`URGENT` is open), in non-deleted cards, columns, and boards. A card assigned to the caller is listed when the caller is `admin`, `manager`, or `member` of its board; an unassigned card is listed for the `admin` and the `manager`s only; a card assigned to someone else is never listed, and a guest gets an empty list. Ordered by due date, creation time, then id; at most 100 items while `total` counts every match.
        Nothing is stored: no notification row is created, and `GET /api/notifications` and its `unread_count` are unchanged.
      responses:
        "200":
          description: Overdue cards and the total number of matches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverdueEnvelope" }
              example:
                data:
                  items:
                    - { card_id: c2d5e4a1-0b6f-4e3d-9d1c-7f8e9a0b1c33, title: Write the spec, due_date: "2026-11-14", status: URGENT, column_name: To Do, board_id: 9c1f6a52-2d0e-4f9c-8f64-6d5d3f7a0c01, board_name: Product roadmap, days_overdue: 2 }
                  total: 1
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/notifications/{notification_id}/read:
    parameters:
      - name: notification_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Notifications]
      summary: Mark a notification as read (recipient only, idempotent)
      description: No body. Repeating the request returns 200 with `is_read` still true.
      responses:
        "200":
          description: The notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/boards/{board_id}/analytics:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [Analytics]
      summary: Board analytics (admin only)
      description: Cards per non-deleted column (0 for empty ones, in column order); cards completed this week (non-deleted cards with `status` `DONE` and `completed_at` from Monday 00:00 UTC up to and including now, whatever column they are in; 0 when there are none); assigned cards and written comments for every active admin, manager, and member (guests are not listed). Cards with status `URGENT` are not counted as completed. Admin only, so a manager, a member, or a guest gets 403.
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsEnvelope" }
              example:
                data:
                  cards_per_column:
                    - { column_id: 5a7c0f3e-91b2-4b47-a4c5-0c0d8f2d1e22, name: To Do, count: 3 }
                    - { column_id: 6b8d1a4f-02c3-4c58-b5d6-1d1e9a3e2f33, name: Done, count: 0 }
                  completed_this_week: 0
                  member_activity:
                    - { user_id: 3f2b1c1e-7d54-4c1a-9a43-0b5e2f6f1d11, name: Ada Lovelace, assigned_cards: 2, comments: 5 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (`type=access`) from login or refresh.
    refreshAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Refresh token (`type=refresh`), accepted only by `POST /api/auth/refresh`.

  parameters:
    BoardId:
      name: board_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CardId:
      name: card_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteToken:
      name: token
      in: path
      required: true
      description: A random URL-safe invitation token (43 characters as generated)
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{43,128}$" }

  responses:
    ValidationError:
      description: Validation failed (unknown fields are rejected too). The message lists the failing fields.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: "name: Length must be between 1 and 100." }
    Unauthorized:
      description: Missing, malformed, expired, or wrong-type token, or the token's user was deleted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: Authentication required }
    Forbidden:
      description: Not a participant of the board, a role below the required level (a guest on a write endpoint, a member on a manager endpoint, a manager on an admin endpoint), a rank-rule violation on a role change or removal, or not the comment author. The message never contains resource data or tokens.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: You do not have permission to perform this action }
    NotFound:
      description: The resource does not exist, is soft deleted, or the id is not a valid UUID
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: Resource not found }
    MethodNotAllowed:
      description: Method not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: Method not allowed }

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string, maxLength: 500 }
    HealthEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string, example: ok }

    # --- requests ---
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: Trimmed }
        email: { type: string, format: email, maxLength: 254, description: Trimmed and lowercased }
        password: { type: string, minLength: 8, maxLength: 128 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1 }
    UserUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: "`email` is not accepted (400 for any value). `password` and `current_password` go together."
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 8, maxLength: 128 }
        current_password: { type: string, minLength: 1, description: Required with `password`; must match the stored password }
    NameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: Trimmed; blank is rejected }
    MemberAddRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    OrderRequest:
      type: object
      additionalProperties: false
      required: [column_id, order]
      properties:
        column_id: { type: string, format: uuid }
        order:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          description: Finite JSON number greater than 0 (strings, booleans, NaN, and Infinity are rejected)
    CardCreateRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: Trimmed }
        description: { type: string, maxLength: 5000, nullable: true }
        due_date: { type: string, format: date, nullable: true, description: "ISO date, e.g. 2026-12-01 (date-times are rejected)" }
        labels:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 30 }
        assignee_id: { type: string, format: uuid, nullable: true, description: Must have the role admin, manager, or member on the card's board }
    CardUpdateRequest:
      type: object
      additionalProperties: false
      description: Same fields as create, all optional, plus `status`. `title` and `status` cannot be null.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/CardStatus" }
        description: { type: string, maxLength: 5000, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        labels:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 30 }
        assignee_id: { type: string, format: uuid, nullable: true }
    ChecklistCreateRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 200, description: Trimmed; blank is rejected }
    ChecklistUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        text: { type: string, minLength: 1, maxLength: 200 }
        is_done: { type: boolean, description: Only the JSON booleans true and false are accepted }
        order: { type: number, format: double, exclusiveMinimum: true, minimum: 0 }
    CardLinkCreateRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, maxLength: 2048, description: "Trimmed; scheme http or https, with a host name; no whitespace or control characters" }
        label: { type: string, minLength: 1, maxLength: 100, description: Trimmed; defaults to the lower-case host name }
    CardLinkUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        url: { type: string, maxLength: 2048 }
        label: { type: string, minLength: 1, maxLength: 100 }
    MemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { type: string, enum: [guest, member, manager], description: "`admin` and other values are rejected with 400" }
    CardStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, URGENT, DONE]
      description: Exact and case-sensitive. Shown to users as Not started, In progress, Urgent, and Done.
    CommentRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 2000, description: Must contain a non-whitespace character; stored as sent }

    # --- resources ---
    User:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }
    UserRef:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
    Board:
      type: object
      properties:
        board_id: { type: string, format: uuid }
        name: { type: string }
        my_role: { type: string, enum: [admin, manager, member, guest], description: The caller's role on this board }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BoardSummary:
      description: A Board as returned by GET, POST, and PATCH `/api/boards`. GET `/api/boards/{board_id}` (`BoardDetail`) does not carry the two counts.
      allOf:
        - $ref: "#/components/schemas/Board"
        - type: object
          required: [member_count, card_count]
          properties:
            member_count: { type: integer, minimum: 0, description: Number of non-deleted board memberships of any role (admin, manager, member, and guest) }
            card_count: { type: integer, minimum: 0, description: Number of non-deleted cards on the board, whatever their column, assignee, or status }
    Member:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, manager, member, guest] }
    Column:
      type: object
      properties:
        column_id: { type: string, format: uuid }
        board_id: { type: string, format: uuid }
        name: { type: string }
        order: { type: number, format: double }
    CardCore:
      type: object
      properties:
        card_id: { type: string, format: uuid }
        board_id: { type: string, format: uuid }
        column_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        labels: { type: array, items: { type: string } }
        assignee:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true
        order: { type: number, format: double }
        status: { $ref: "#/components/schemas/CardStatus" }
        completed_at: { type: string, format: date-time, nullable: true, description: "Set when the status becomes DONE, null otherwise" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Card:
      description: A card in board detail and in the create, update, and position responses
      allOf:
        - $ref: "#/components/schemas/CardCore"
        - type: object
          properties:
            checklist_done: { type: integer, description: Non-deleted checklist items with is_done true }
            checklist_total: { type: integer, description: Non-deleted checklist items }
            link_count: { type: integer, description: Non-deleted links }
    ChecklistItem:
      type: object
      properties:
        checklist_item_id: { type: string, format: uuid }
        text: { type: string }
        is_done: { type: boolean }
        order: { type: number, format: double }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CardLink:
      type: object
      properties:
        card_link_id: { type: string, format: uuid }
        url: { type: string }
        label: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    CardDetail:
      allOf:
        - $ref: "#/components/schemas/Card"
        - type: object
          properties:
            checklist:
              type: array
              items: { $ref: "#/components/schemas/ChecklistItem" }
            links:
              type: array
              items: { $ref: "#/components/schemas/CardLink" }
    OverdueItem:
      type: object
      properties:
        card_id: { type: string, format: uuid }
        title: { type: string }
        due_date: { type: string, format: date }
        status: { $ref: "#/components/schemas/CardStatus" }
        column_name: { type: string }
        board_id: { type: string, format: uuid }
        board_name: { type: string }
        days_overdue: { type: integer, minimum: 1 }
    CardSearchResult:
      allOf:
        - $ref: "#/components/schemas/CardCore"
        - type: object
          properties:
            board_name: { type: string }
            column_name: { type: string }
    ColumnWithCards:
      allOf:
        - $ref: "#/components/schemas/Column"
        - type: object
          properties:
            cards:
              type: array
              items: { $ref: "#/components/schemas/Card" }
    BoardDetail:
      allOf:
        - $ref: "#/components/schemas/Board"
        - type: object
          properties:
            columns:
              type: array
              items: { $ref: "#/components/schemas/ColumnWithCards" }
    Comment:
      type: object
      properties:
        comment_id: { type: string, format: uuid }
        card_id: { type: string, format: uuid }
        content: { type: string }
        author: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        notification_id: { type: string, format: uuid }
        type: { type: string, enum: [assignment, comment] }
        message: { type: string, maxLength: 255 }
        card_id: { type: string, format: uuid }
        board_id: { type: string, format: uuid, description: Use it to navigate to the board without a card lookup }
        is_read: { type: boolean }
        created_at: { type: string, format: date-time }
    NotificationPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        unread_count: { type: integer }
    InviteLink:
      type: object
      properties:
        role: { type: string, enum: [member, guest] }
        token: { type: string, description: Secret; only the board admin and managers ever receive it }
    InviteLinks:
      type: object
      properties:
        member: { $ref: "#/components/schemas/InviteLink" }
        guest: { $ref: "#/components/schemas/InviteLink" }
    InviteInfo:
      type: object
      properties:
        board_id: { type: string, format: uuid }
        board_name: { type: string }
        role: { type: string, enum: [member, guest], description: The role this token grants }
        current_role: { type: string, enum: [admin, manager, member, guest], nullable: true, description: "The caller's active role on the board, or null" }
    AcceptResult:
      type: object
      properties:
        board_id: { type: string, format: uuid }
        role: { type: string, enum: [admin, manager, member, guest], description: The caller's role after accepting }
    Analytics:
      type: object
      properties:
        cards_per_column:
          type: array
          items:
            type: object
            properties:
              column_id: { type: string, format: uuid }
              name: { type: string }
              count: { type: integer }
        completed_this_week: { type: integer }
        member_activity:
          type: array
          items:
            type: object
            properties:
              user_id: { type: string, format: uuid }
              name: { type: string }
              assigned_cards: { type: integer }
              comments: { type: integer }

    # --- envelopes ---
    UserEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/User" }
    LoginEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            token_type: { type: string, example: Bearer }
            expires_in: { type: integer, description: Access token lifetime in seconds (from server configuration) }
            refresh_expires_in: { type: integer, description: Refresh token lifetime in seconds (from server configuration) }
            user: { $ref: "#/components/schemas/User" }
    RefreshEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token: { type: string }
            token_type: { type: string, example: Bearer }
            expires_in: { type: integer }
    BoardEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/BoardSummary" }
    BoardDetailEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/BoardDetail" }
    BoardIdEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            board_id: { type: string, format: uuid }
    MemberEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Member" }
    ColumnEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Column" }
    CardEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Card" }
    CardDetailEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/CardDetail" }
    ChecklistItemEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/ChecklistItem" }
    CardLinkEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/CardLink" }
    OverdueEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              maxItems: 100
              items: { $ref: "#/components/schemas/OverdueItem" }
            total: { type: integer, description: Every match, not just the returned items }
    CommentEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Comment" }
    NotificationEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Notification" }
    NotificationPageEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/NotificationPage" }
    InviteLinksEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/InviteLinks" }
    InviteLinkEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/InviteLink" }
    InviteInfoEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/InviteInfo" }
    AcceptResultEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/AcceptResult" }
    AnalyticsEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Analytics" }
