        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/cards:
    get:
      tags: [Cards]
      summary: Search cards, or list my tasks
      description: |
        Valid combinations only: `assignee=me`, or `q` with an optional `board_id`. Anything else (no parameters, empty `q`, `q` over 100 chars, bad `board_id`, `assignee` together with `q`, unknown parameters) gives 400.
        Search matches title or description case-insensitively across the boards where the caller has any role (guests included); `%`, `_`, and `\` are literal. `board_id` restricts the search; a board where the caller has no membership gives 403. Every result carries `status` and `completed_at`. Soft-deleted cards, columns, and boards are excluded. Results are ordered by board name, column order, card order.
      parameters:
        - name: assignee
          in: query
          schema: { type: string, enum: [me] }
        - name: q
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: board_id
          in: query
          description: Only valid together with `q`
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Matching cards (empty list when none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CardSearchResult" }
              example:
                data:
                  - card_id: c2d5e4a1-0b6f-4e3d-9d1c-7f8e9a0b1c33
                    board_id: 9c1f6a52-2d0e-4f9c-8f64-6d5d3f7a0c01
                    column_id: 5a7c0f3e-91b2-4b47-a4c5-0c0d8f2d1e22
                    title: Write the spec
                    description: First draft
                    due_date: "2026-12-01"
                    labels: [docs]
                    assignee: { user_id: 3f2b1c1e-7d54-4c1a-9a43-0b5e2f6f1d11, name: Ada Lovelace }
                    order: 1.0
                    status: NOT_STARTED
                    completed_at: null
                    created_at: "2026-11-16T10:25:00.000000Z"
                    updated_at: "2026-11-16T10:25:00.000000Z"
                    board_name: Product roadmap
                    column_name: To Do
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/cards/{card_id}:
    parameters:
      - $ref: "#/components/parameters/CardId"
    get:
      tags: [Cards]
      summary: Card detail with checklist, links, and counts (any role)
      description: Any participant may read it, a guest included. The checklist is ordered by `order` then creation time, the links by creation time; soft-deleted items and links are excluded. A non-participant gets 403, a missing or soft-deleted card 404.
      responses:
        "200":
          description: The card with its checklist and links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardDetailEnvelope" }
              example:
                data:
                  card_id: c2d5e4a1-0b6f-4e3d-9d1c-7f8e9a0b1c33
                  board_id: 9c1f6a52-2d0e-4f9c-8f64-6d5d3f7a0c01
                  column_id: 5a7c0f3e-91b2-4b47-a4c5-0c0d8f2d1e22
                  title: Write the spec
                  description: First draft
                  due_date: "2026-12-01"
                  labels: [docs]
                  assignee: null
                  order: 1.0
                  status: URGENT
                  completed_at: null
                  created_at: "2026-11-16T10:25:00.000000Z"
                  updated_at: "2026-11-16T10:25:00.000000Z"
                  checklist_done: 1
                  checklist_total: 2
                  link_count: 1
                  checklist:
                    - { checklist_item_id: 0b1c2d3e-4f50-4a61-8b72-93a4b5c6d7e8, text: Outline, is_done: true, order: 1.0, created_at: "2026-11-16T10:26:00.000000Z", updated_at: "2026-11-16T10:27:00.000000Z" }
                    - { checklist_item_id: 1c2d3e4f-5061-4b72-9c83-a4b5c6d7e8f9, text: Review, is_done: false, order: 2.0, created_at: "2026-11-16T10:26:30.000000Z", updated_at: "2026-11-16T10:26:30.000000Z" }
                  links:
                    - { card_link_id: 2d3e4f50-6172-4c83-8d94-b5c6d7e8f90a, url: "https://docs.example.com/spec", label: docs.example.com, created_by: 3f2b1c1e-7d54-4c1a-9a43-0b5e2f6f1d11, created_at: "2026-11-16T10:28:00.000000Z" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Cards]
      summary: Update a card (admin, manager, or member; a guest gets 403)
      description: Partial update; only supplied fields change. `status` must be exactly `NOT_STARTED`, `IN_PROGRESS`, `URGENT`, or `DONE` (null, an empty string, and other letter cases are 400). Changing the status to `DONE` sets `completed_at` to now, leaving `DONE` clears it, and repeating the current status (or omitting it) leaves it unchanged; `completed_at` itself cannot be sent. `description`, `due_date`, and `assignee_id` may be `null` to clear them; `title` and `labels` may not be null. An empty body is a no-op. Changing the assignee to another user creates an `assignment` notification.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardUpdateRequest" }
            example: { title: Write the final spec, assignee_id: null }
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardEnvelope" }
        "400":
          description: Validation error, `status` in the body, or the assignee is not an admin, manager, or member of the board (a guest, a removed member, and a non-participant are all rejected)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Cards]
      summary: Soft delete a card with its comments, checklist items, and links (admin, manager, or member; a guest gets 403)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      card_id: { type: string, format: uuid }
              example: { data: { card_id: c2d5e4a1-0b6f-4e3d-9d1c-7f8e9a0b1c33 } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/cards/{card_id}/position:
    parameters:
      - $ref: "#/components/parameters/CardId"
    patch:
      tags: [Cards]
      summary: Move a card to a column and order (drag and drop; admin, manager, or member; a guest gets 403)
      description: Stores the client-supplied `order`. The target column must be active and in the same board as the card, otherwise 400. The card's `status` and `completed_at` never change here, not even when the target column is named `Done`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderRequest" }
            example: { column_id: 5a7c0f3e-91b2-4b47-a4c5-0c0d8f2d1e22, order: 1.5 }
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardEnvelope" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/cards/{card_id}/comments:
    parameters:
      - $ref: "#/components/parameters/CardId"
    post:
      tags: [Comments]
      summary: Add a comment (admin, manager, or member; a guest gets 403)
      description: Notifies the card's assignee and the board admin (type `comment`), never the author, at most once per person.
      requestBody:
