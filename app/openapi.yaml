openapi: 3.0.3
info:
  title: Kano API
  version: "3.0.0"
  description: |
    REST API of Kano, a Trello-like task management app. Reference for frontend development.

    **Response envelope.** Every body is exactly `{ "data": ... }` on success or `{ "error": "<message, max 500 chars>" }` on failure. The status code is never part of the body.

    **Status codes.** 201 only for the eight creating POSTs (register, create board, add member, create column, create card, create comment, add checklist item, add card link). Every other success is 200 (including `POST /api/auth/login`, `POST /api/auth/refresh`, `POST /api/boards/{board_id}/invite-links/{role}/regenerate`, `POST /api/invites/{token}/accept`, and the member role change), and DELETE returns 200 with a `data` object (never 204).
    Failures: 400 validation, 401 missing/invalid/expired/wrong-type token, 403 not allowed, 404 missing, soft-deleted, or malformed id, 405 wrong method, 409 duplicate, 500 `"Internal server error"`.

    **Roles.** Every board member has one role per board, ranked `guest` < `member` < `manager` < `admin`: `admin` (the creator, the only admin), `manager` (granted by the admin), `member` (can edit cards), or `guest` (view only, joined through a guest invitation link). Four levels are used: *reader* endpoints accept any role; *writer* endpoints need `admin`, `manager`, or `member` and answer 403 to a guest; *manager* endpoints (columns, adding members, role changes, removals, invitation links) need `admin` or `manager` and answer 403 to a member or guest; *admin* endpoints need `admin`. Comment edits and deletes also need to be the author.

    **Rank rule.** A role change or a removal is allowed only on a member of strictly lower rank than the caller, and a role can be granted only if it is below the caller's own (so only the admin grants `manager`, and `admin` can never be granted). The board creator is never changed or removed.

    **Authentication.** `POST /api/auth/login` returns an access token and a refresh token. Send the access token as `Authorization: Bearer <token>`. A refresh token is accepted only by `POST /api/auth/refresh`; on any other endpoint it gets 401.

    **Check order.** For board-scoped endpoints the server checks 401, then 404 (resource missing or soft-deleted), then 403 (not a participant, then a role below the required level: a guest on a write endpoint, a member on a manager endpoint, a manager on an admin endpoint, a non-author on a comment edit), and only then validates the body (400). The one exception is the member role change, which validates its body first. A 403 body never contains resource data.

    **Formats.** Ids are lowercase hyphenated UUID strings. Timestamps are ISO 8601 UTC ending in `Z`. `due_date` is an ISO date (`YYYY-MM-DD`). `order` values are floats greater than 0; the server allocates the last position on create, the client computes the value for moves (midpoint of neighbours, or half of the first).

    **Card status.** Every card has a `status` (`NOT_STARTED`, `IN_PROGRESS`, `URGENT`, or `DONE`, exact and case-sensitive) and a `completed_at` timestamp that the server sets when the status becomes `DONE` and clears when it leaves `DONE` (moves among the other three values leave it unchanged). Moving a card to another column never changes either field. Only `DONE` counts as completed: analytics counts completed cards from `status` and `completed_at`, not from the name of a column, and the overdue list skips only `DONE` cards.

    **Checklist and links.** A card has up to 50 checklist items and up to 10 workspace links. The card JSON of board detail and of the create, update, and position responses carries `checklist_done`, `checklist_total`, and `link_count`; the full lists come from `GET /api/cards/{card_id}`. Search and My Tasks results carry no counts.

    **Deletes** are soft deletes with cascades: a Board deletes its memberships (all four roles), columns, cards, comments, checklist items, and links, and its invitation tokens stop working; a Column deletes its cards and their comments, checklist items, and links; a Card deletes its comments, checklist items, and links.
servers:
  - url: http://localhost:5000
    description: Local development (`flask run`)
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Boards
  - name: Members
  - name: Columns
  - name: Cards
  - name: Checklist
  - name: Links
  - name: Comments
  - name: Notifications
  - name: Analytics
  - name: Invitations
security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check (no database access)
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
              example:
                data: { status: ok }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
            example: { name: Ada Lovelace, email: ada@example.com, password: s3cretpass }
      responses:
        "201":
          description: User created (email is stored lowercased)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
              example:
                data:
                  user_id: 3f2b1c1e-7d54-4c1a-9a43-0b5e2f6f1d11
                  name: Ada Lovelace
                  email: ada@example.com
                  created_at: "2026-11-16T10:15:30.123456Z"
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Email already registered (case-insensitive)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example: { error: Email already registered }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { email: ada@example.com, password: s3cretpass }
      responses:
        "200":
          description: Tokens and the user profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginEnvelope" }
              example:
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh
                  token_type: Bearer
                  expires_in: 3600
                  refresh_expires_in: 604800
                  user:
                    user_id: 3f2b1c1e-7d54-4c1a-9a43-0b5e2f6f1d11
                    name: Ada Lovelace
                    email: ada@example.com
                    created_at: "2026-11-16T10:15:30.123456Z"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: Unknown email, wrong password, or deleted user (identical message for all three)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example: { error: Invalid email or password }

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Get a new access token
      description: Send the **refresh** token as the Bearer token. No body. Refresh tokens are stateless and are not rotated.
      security:
        - refreshAuth: []
      responses:
        "200":
          description: A new access token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshEnvelope" }
              example:
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.newaccess
                  token_type: Bearer
                  expires_in: 3600
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/users/me:
    get:
      tags: [Users]
      summary: Current user profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
              example:
                data:
                  user_id: 3f2b1c1e-7d54-4c1a-9a43-0b5e2f6f1d11
                  name: Ada Lovelace
                  email: ada@example.com
                  created_at: "2026-11-16T10:15:30.123456Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Users]
      summary: Update name and/or password
      description: |
        Send `name`, or `password` together with `current_password`, or both. The email is fixed after registration, so any `email` field (with any value) is rejected with 400 naming `email`. A wrong or missing `current_password` is 400 (never 403) naming `current_password`, and then nothing is saved, not even a `name` sent in the same request. `current_password` without `password`, a body with neither `name` nor `password`, and unknown fields are 400 too. Tokens stay valid after a password change (tokens are stateless).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdateRequest" }
            examples:
              rename: { summary: Change the name, value: { name: Ada King } }
              password: { summary: Change the password, value: { password: n3wsecretpass, current_password: s3cretpass } }
      responses:
        "200":
          description: Updated profile (never contains a password or hash)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "400":
          description: Validation failed, `email` was sent, or `current_password` is wrong or missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                email: { value: { error: "email: email cannot be changed" } }
                current_password: { value: { error: "current_password: does not match" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/boards:
    post:
      tags: [Boards]
      summary: Create a board (the creator becomes its admin)
      description: Also creates the board's two invitation tokens (member and guest) in the same transaction. They are not part of this response; the admin reads them with `GET /api/boards/{board_id}/invite-links`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
            example: { name: Product roadmap }
      responses:
        "201":
          description: Board created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardEnvelope" }
              example:
                data:
                  board_id: 9c1f6a52-2d0e-4f9c-8f64-6d5d3f7a0c01
                  name: Product roadmap
                  my_role: admin
                  created_at: "2026-11-16T10:20:00.000000Z"
                  updated_at: "2026-11-16T10:20:00.000000Z"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [Boards]
      summary: List my boards (newest first)
      responses:
        "200":
          description: Boards where the caller has an active membership of any role (`my_role` says which)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/BoardSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/boards/{board_id}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [Boards]
      summary: Board detail with columns and cards
      description: "Any role may read it (a guest gets `my_role: guest` and the same data). Every non-deleted card is returned, each with `status` and `completed_at`. Columns are ordered by `order`, cards by `order` within their column. Runs a fixed number of queries (5, including the user lookup) regardless of card count; each card carries `checklist_done`, `checklist_total`, and `link_count`."
      responses:
        "200":
          description: Board with nested columns and cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardDetailEnvelope" }
              example:
                data:
                  board_id: 9c1f6a52-2d0e-4f9c-8f64-6d5d3f7a0c01
                  name: Product roadmap
                  my_role: member
                  created_at: "2026-11-16T10:20:00.000000Z"
                  updated_at: "2026-11-16T10:20:00.000000Z"
                  columns:
                    - column_id: 5a7c0f3e-91b2-4b47-a4c5-0c0d8f2d1e22
                      board_id: 9c1f6a52-2d0e-4f9c-8f64-6d5d3f7a0c01
                      name: To Do
                      order: 1.0
                      cards:
                        - card_id: c2d5e4a1-0b6f-4e3d-9d1c-7f8e9a0b1c33
                          board_id: 9c1f6a52-2d0e-4f9c-8f64-6d5d3f7a0c01
                          column_id: 5a7c0f3e-91b2-4b47-a4c5-0c0d8f2d1e22
                          title: Write the spec
                          description: First draft
                          due_date: "2026-12-01"
                          labels: [docs]
                          assignee: { user_id: 3f2b1c1e-7d54-4c1a-9a43-0b5e2f6f1d11, name: Ada Lovelace }
                          order: 1.0
                          status: NOT_STARTED
                          completed_at: null
                          created_at: "2026-11-16T10:25:00.000000Z"
                          updated_at: "2026-11-16T10:25:00.000000Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Boards]
      summary: Rename the board (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
            example: { name: Roadmap 2027 }
      responses:
        "200":
          description: Updated board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardEnvelope" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Boards]
      summary: Soft delete the board and everything in it (admin only)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardIdEnvelope" }
              example: { data: { board_id: 9c1f6a52-2d0e-4f9c-8f64-6d5d3f7a0c01 } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/boards/{board_id}/members:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    post:
      tags: [Members]
      summary: Add a member by email (admin or manager)
      description: Always creates the role `member`. A manager cannot add a higher role, and a guest joins only through the guest invitation link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberAddRequest" }
            example: { email: grace@example.com }
      responses:
        "201":
          description: Member added with role `member`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberEnvelope" }
              example:
                data:
                  user_id: 7e9a2b44-5c1d-4a8e-b2f0-1d3c5e7a9b55
                  name: Grace Hopper
                  email: grace@example.com
                  role: member
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Board not found, or no user with that email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example: { error: No user with that email }
        "409":
          description: Already has an active membership on this board (any role)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example: { error: User is already a member of this board }
    get:
      tags: [Members]
      summary: List members (oldest first, any role including guest)
      description: Each row carries the member's role (`admin`, `manager`, `member`, or `guest`).
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/boards/{board_id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Members]
      summary: Change a member's role (admin or manager, rank rule)
      description: |
        Sets the target's role to `guest`, `member`, or `manager`. `admin` and any other value give 400, and so does a missing or non-string `role`. The body is validated **first**, so an invalid body gives 400 even for a caller who would otherwise get 403 (this endpoint's one exception to the usual check order).
        Then: 404 (board), 403 (caller is not admin or manager), 404 (the target has no active membership), the rank rule (403 unless the caller outranks both the target's current role and the new role; 400 for the admin who targets themselves, 403 for a manager who targets the admin), then the write. A role equal to the current one returns 200 and changes nothing. Changing a member to `guest` clears that user's assignee on this board's cards in the same transaction; changing to `manager` keeps assignments. No notification is created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRoleRequest" }
            example: { role: manager }
      responses:
        "200":
          description: The member with the new role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberEnvelope" }
              example:
                data: { user_id: 7e9a2b44-5c1d-4a8e-b2f0-1d3c5e7a9b55, name: Grace Hopper, email: grace@example.com, role: manager }
        "400":
          description: Missing, non-string, or non-assignable `role` (including `admin`), or the target is the board creator and the caller is the admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Board not found, or the user is not an active member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    delete:
      tags: [Members]
      summary: Remove a member or guest (admin or manager, rank rule)
      description: Allowed only on a member of strictly lower rank than the caller (an admin may remove a manager; a manager may remove a member or guest, never another manager or the admin, and 403 for the attempt). The board creator cannot be removed, so the admin targeting themselves gets 400. Clears the removed user's assignments on this board's cards in the same transaction. Check order 401, 404 (board, then target), 403, 400, then the write.
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user_id: { type: string, format: uuid }
              example: { data: { user_id: 7e9a2b44-5c1d-4a8e-b2f0-1d3c5e7a9b55 } }
        "400":
          description: The target is the board creator (the admin removing themselves)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Board not found, or the user is not a member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/boards/{board_id}/columns:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    post:
      tags: [Columns]
      summary: Create a column (admin or manager; a member or guest gets 403)
      description: Placed after the last active column (`order` 1.0 for the first).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
            example: { name: To Do }
      responses:
        "201":
          description: Column created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ColumnEnvelope" }
              example:
                data:
                  column_id: 5a7c0f3e-91b2-4b47-a4c5-0c0d8f2d1e22
                  board_id: 9c1f6a52-2d0e-4f9c-8f64-6d5d3f7a0c01
                  name: To Do
                  order: 1.0
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/boards/{board_id}/columns/reorder:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    patch:
      tags: [Columns]
      summary: Set a column's order (admin or manager; a member or guest gets 403)
      description: Stores the client-supplied `order`. A column of another board, or a deleted/unknown column, gives 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderRequest" }
            example: { column_id: 5a7c0f3e-91b2-4b47-a4c5-0c0d8f2d1e22, order: 0.5 }
      responses:
        "200":
          description: Updated column
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ColumnEnvelope" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/columns/{column_id}:
    parameters:
      - name: column_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Columns]
      summary: Rename a column (admin or manager; a member or guest gets 403)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
            example: { name: Doing }
      responses:
        "200":
          description: Updated column
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ColumnEnvelope" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Columns]
      summary: Soft delete a column with its cards, comments, checklist items, and links (admin or manager; a member or guest gets 403)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      column_id: { type: string, format: uuid }
              example: { data: { column_id: 5a7c0f3e-91b2-4b47-a4c5-0c0d8f2d1e22 } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/columns/{column_id}/cards:
    parameters:
      - name: column_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Cards]
      summary: Create a card in a column (admin, manager, or member; a guest gets 403)
      description: Placed after the last active card of the column, always with `status` `NOT_STARTED` and `completed_at` null. A `status` (or `completed_at`) in the body is rejected with 400. The assignee must be an admin, manager, or member of the board; if it is another user, that user gets an `assignment` notification.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardCreateRequest" }
            example:
              title: Write the spec
              description: First draft
              due_date: "2026-12-01"
              labels: [docs]
              assignee_id: 3f2b1c1e-7d54-4c1a-9a43-0b5e2f6f1d11
      responses:
        "201":
          description: Card created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardEnvelope" }
              example:
                data:
                  card_id: c2d5e4a1-0b6f-4e3d-9d1c-7f8e9a0b1c33
                  board_id: 9c1f6a52-2d0e-4f9c-8f64-6d5d3f7a0c01
                  column_id: 5a7c0f3e-91b2-4b47-a4c5-0c0d8f2d1e22
